[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvfp4-weight-quant-blackwell"
version = "0.1.0"
description = "NVFP4 E2M1/FP8-scale quantization, packing and CUTLASS SM100 GEMM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
